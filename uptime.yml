# To gather the uptime and load average of the hosts, we can use the `uptime` command. Below is an example of an Ansible playbook that collects this information from all hosts in the inventory and saves it to a file on the controller.
---
- name: Gather uptime and load average from hosts
  hosts: ubuntu
  become: yes
  gather_facts: no

  tasks:
    - name: Get uptime and load average
      shell: uptime
      register: uptime_output

    - name: Save uptime and load average to a file on the controller
      delegate_to: localhost
      copy:
        dest: /tmp/uptime_output.txt
        content: "{{ inventory_hostname }} | {{ uptime_output.stdout }}\n"
        mode: '0644'
